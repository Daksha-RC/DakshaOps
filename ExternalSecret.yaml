apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-cnpg-trimmed-password-secret # A clear, specific name
  namespace: default
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: dev-cnpg-secret-store-store # Your ClusterSecretStore name
    kind: ClusterSecretStore
  target:
    name: dev-cnpg-trimmed-password-secret # Name of the Kubernetes Secret to create
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2 # <--- Enable v2 templating for string functions
      data:
        # Fetch the raw password and apply the 'trim' function
        DB_PASSWORD_TRIMMED: "{{ .cnpgPassword_raw | trim }}"
  data:
    # Fetch only the root-level 'cnpgPassword' as a raw string.
    # We use 'cnpgPassword_raw' as the internal placeholder for the template.
    - secretKey: cnpgPassword_raw
      remoteRef:
        key: cnpgPassword # <--- Target the root-level plain text 'cnpgPassword'